name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild diário pra publicar posts agendados (Astro SSG só inclui pubDatetime passado no
  # momento do build). Mesmo padrão dos outros blogs do SEO Agency.
  schedule:
    - cron: "20 13 * * *"  # 10:20 BRT
    - cron: "20 18 * * *"  # 15:20 BRT (escalonado: evita pico de RAM com blog-dimus 18:00)

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🚀 Build"
        run: pnpm run build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: "☁️ Deploy to Cloudflare Pages"
        run: npx --yes wrangler@4.95.0 pages deploy dist --project-name=blog-alinea --commit-dirty=true
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: 52018198611f38e0520cb272a62bbfe5

      - name: "🔍 IndexNow ping (Bing/Yandex)"
        run: node scripts/indexnow-ping.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: "📣 Notify Studio (deploy succeeded)"
        if: success()
        run: |
          curl -s --max-time 120 -X POST "${{ secrets.STUDIO_DEPLOY_NOTIFY_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.STUDIO_DEPLOY_SECRET }}" \
            -d "{\"status\":\"success\",\"blog\":\"alinea\",\"trigger\":\"${{ github.event_name }}\",\"run_id\":${{ github.run_id }},\"ref\":\"${{ github.ref_name }}\"}" \
            || echo "notify failed (non-blocking)"

      - name: "📣 Notify Studio (deploy failed)"
        if: failure()
        run: |
          curl -s --max-time 120 -X POST "${{ secrets.STUDIO_DEPLOY_NOTIFY_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.STUDIO_DEPLOY_SECRET }}" \
            -d "{\"status\":\"failure\",\"blog\":\"alinea\",\"trigger\":\"${{ github.event_name }}\",\"run_id\":${{ github.run_id }},\"ref\":\"${{ github.ref_name }}\"}" \
            || echo "notify failed (non-blocking)"
