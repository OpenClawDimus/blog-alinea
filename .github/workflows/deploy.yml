name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🚀 Build"
        run: pnpm run build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: "☁️ Deploy to Cloudflare Pages"
        run: npx --yes wrangler@4.95.0 pages deploy dist --project-name=blog-monumental --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_ACCOUNT_ID: f58f884e92d89c2345cb3a2df450a838

      - name: "🔍 IndexNow ping (Bing/Yandex)"
        run: node scripts/indexnow-ping.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
